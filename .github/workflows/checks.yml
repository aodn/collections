name: Checks

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          uvx ruff check --extend-select I
          uvx ruff format --check

      - name: Test
        run: |
          uv sync --group dev
          uv run pytest tests/ -v
