name: CI

on:
  pull_request:
    branches: [main, feature/prefect]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          uv sync --group dev
          uv run ruff check --extend-select I
          uv run ruff format --check

      - name: Test
        run: uv run pytest tests/ -v
